draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30
  combo_w: 28
  combo_h: 26
  key_rx: 6
  key_ry: 6
  outer_pad_w: 30
  outer_pad_h: 56
  line_spacing: 1.2
  arc_radius: 6
  append_colon_to_layer_header: true
  style_layer_activators: true
  glyph_tap_size: 22
  svg_extra_style: |
    .combopos-0 text.combo.tap,
    .combopos-1 text.combo.tap,
    .combopos-2 text.combo.tap { font-size: 20px; }
    .combopos-3 text.combo.tap { font-size: 12px; font-weight: 600; }

    .key.special text.tap { font-size: 20px; }

    .layer-Cursor > text.label { fill: #2563eb; }
    .layer-Cursor rect.key { stroke: #93c5fd; }
    .layer-Cursor .held rect.key { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }

    .layer-Symbol > text.label { fill: #d97706; }
    .layer-Symbol rect.key { stroke: #fcd34d; }
    .layer-Symbol .held rect.key { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }

    .layer-Num > text.label { fill: #15803d; }
    .layer-Num rect.key { stroke: #86efac; }
    .layer-Num .held rect.key { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }

    .layer-Magic > text.label { fill: #7c3aed; }
    .layer-Magic rect.key { stroke: #c4b5fd; }

    .key.trigger-cursor rect.key {
      fill: #dbeafe; stroke: #2563eb; stroke-width: 2;
    }
    .key.trigger-symbol rect.key {
      fill: #fef3c7; stroke: #d97706; stroke-width: 2;
    }
    .key.trigger-num rect.key {
      fill: #dcfce7; stroke: #15803d; stroke-width: 2;
    }
    .combo.trigger-magic rect.combo {
      fill: #ede9fe; stroke: #7c3aed; stroke-width: 2;
    }
    .key.trigger-cursor text.hold {
      fill: #2563eb;
      font-size: 16.5px;
      font-weight: bold;
    }
    .key.trigger-symbol text.hold { fill: #d97706; font-weight: bold; }
    .key.trigger-num text.hold { fill: #15803d; font-weight: bold; }

  # Font Awesome Free bluetooth-b, CC BY 4.0: https://fontawesome.com/license/free
  glyphs:
    bluetooth: |
      <svg viewBox="0 0 256 512">
        <path d="M164.9 260L257.5 156.7 111.6 0 111.6 206.3 25.4 120.2-6 151.6 102.1 260-6 368.4 25.4 399.8 111.6 313.7 114.3 512 262.8 363.4 164.9 260zm40.9-103-50 50-.3-100.3 50.3 50.3zm-50 156 50 50-50.3 50.3.3-100.3z"/>
      </svg>
